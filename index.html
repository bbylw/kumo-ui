<!doctype html>
<html lang="zh-CN" data-mode="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kumo UI · Cloudflare 的 React 组件库</title>
    <meta
      name="description"
      content="Kumo 是 Cloudflare 用于构建现代 Web 应用的 React 组件库。基于 Base UI 构建，提供 54 个无障碍组件、40 个原语与可安装 Blocks，并附带面向 AI 的组件注册表。"
    />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        var stored = localStorage.getItem("kumo-theme");
        document.documentElement.dataset.mode = stored === "light" ? "light" : "dark";
      } catch (error) {
        document.documentElement.dataset.mode = "dark";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
